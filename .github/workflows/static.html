<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PPL Trainingsbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-first logbook column; plate colours (IWF bumper: red 25 kg, blue 20 kg, yellow 15 kg) mark Push / Pull / Legs */
:root{
  --bg:#edf0f3; --surface:#ffffff; --field:#f5f7f9; --ink:#17202b; --muted:#5b6676; --line:#d6dce4;
  --push:#c4333b; --pull:#1d5ebd; --legs:#d9a514; --on-legs:#1d1a10; --on-day:#ffffff;
  --good:#2e8550; --good-bg:#e3f2e8; --warn:#9a6a00; --warn-bg:#fbf1d6; --crit:#b3261e;
  --focus:#1d5ebd;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141a; --surface:#192029; --field:#131920; --ink:#e7ecf2; --muted:#9aa6b5; --line:#2b3441;
  --push:#e4545c; --pull:#5c93e6; --legs:#e5b83a; --on-legs:#1d1a10; --on-day:#ffffff;
  --good:#5cc082; --good-bg:#16301f; --warn:#e5b83a; --warn-bg:#2f2810; --crit:#f07a72;
  --focus:#7aa9ee; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141a; --surface:#192029; --field:#131920; --ink:#e7ecf2; --muted:#9aa6b5; --line:#2b3441;
  --push:#e4545c; --pull:#5c93e6; --legs:#e5b83a; --on-legs:#1d1a10; --on-day:#ffffff;
  --good:#5cc082; --good-bg:#16301f; --warn:#e5b83a; --warn-bg:#2f2810; --crit:#f07a72;
  --focus:#7aa9ee; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.hdr-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.elapsed{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:8px;background:var(--ink);color:var(--bg)}
.elapsed .el-l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.elapsed .el-v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.elapsed.static{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.timefield{display:flex;gap:6px}
.timefield input{min-width:0}
.weekbadge{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--muted);letter-spacing:.03em}
.weekbadge b{color:var(--ink)}
nav.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px 9px;font-family:var(--f-display);font-weight:600;font-size:18px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.view{padding-top:18px;display:grid;gap:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

.controls{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:end}
@media (max-width:640px){.controls{grid-template-columns:1fr 1fr}.controls .segf{grid-column:1/-1}}
.controls.tri{grid-template-columns:auto auto auto 1fr}
@media (max-width:760px){.controls.tri{grid-template-columns:1fr 1fr 1fr}.controls.tri .segf{grid-column:1/-1}}
@media (max-width:440px){.controls.tri{grid-template-columns:1fr 1fr}.controls.tri .datef{grid-column:1/-1}}
.field{display:grid;gap:4px}
input[type="date"],select,textarea,.inp{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{width:100%;min-height:72px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 6px;min-height:48px;cursor:pointer;font-family:var(--f-display);font-weight:700;
  font-size:20px;letter-spacing:.03em;text-transform:uppercase;position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button + button{border-left:1px solid var(--line)}
.seg .plate{width:12px;height:12px;border-radius:50%;flex:none}
.seg button[aria-pressed="true"]{color:var(--on-day)}
.seg button[data-day="push"][aria-pressed="true"]{background:var(--push)}
.seg button[data-day="pull"][aria-pressed="true"]{background:var(--pull)}
.seg button[data-day="legs"][aria-pressed="true"]{background:var(--legs);color:var(--on-legs)}
.seg button[aria-pressed="true"] .plate{background:currentColor!important}
.seg .sugg{position:absolute;top:3px;right:6px;font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.p-push{background:var(--push)} .p-pull{background:var(--pull)} .p-legs{background:var(--legs)}

.phase{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:baseline;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.phase strong{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.phase.deload{background:var(--warn-bg);border-color:transparent}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);font-size:14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.ex-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.ex-no{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--muted);min-width:22px}
.ex-name{font-weight:600;font-size:17px;line-height:1.25;min-width:0}
.ex-target{font-size:14px;color:var(--muted);margin-top:2px}
.ex-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:440px){.ex-head{grid-template-columns:auto 1fr}.ex-btns{grid-column:1/-1;justify-content:flex-start}}
.swap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.swap-opt{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;min-height:48px}
.swap-opt span:first-child{font-weight:600;font-size:15px}
.swap-k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.swap-opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--pull);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);min-height:50px;font-size:16px;padding:10px 18px}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
.last{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;padding:8px 10px;background:var(--field);border-radius:8px}
.hint{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.hint.up{background:var(--good-bg);color:var(--good)}
.hint.deload{background:var(--warn-bg);color:var(--warn)}

.sets{display:grid;grid-template-columns:24px minmax(64px,auto) minmax(0,1fr) minmax(0,1fr) 22px;gap:6px 8px;align-items:center}
.prev{font-size:14px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap;padding:4px 6px;border-radius:6px;background:var(--field)}
.prev.beat{color:var(--good);background:var(--good-bg)}
.prev.none{font-weight:500;opacity:.6;background:none}
.sets .h{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setno{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;text-align:center;font-size:18px;font-weight:600;background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:6px}
.sets input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);justify-self:center}
.tick.done{background:var(--good);border-color:var(--good)}
.setno.done{color:var(--good)}
.ex-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.ex-foot .grp{display:flex;gap:8px}

.finish{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.finish-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

.done-card{background:var(--good-bg);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.done-card h2{margin:0;font-family:var(--f-display);font-size:24px}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05}
.weekgrp{display:grid;gap:10px}
.weekgrp h3{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sess summary::-webkit-details-marker{display:none}
.daychip{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;color:var(--on-day)}
.daychip.legs{color:var(--on-legs)}
.sess-meta{min-width:0}
.sess-meta .d{font-weight:600}
.chev{color:var(--muted);transition:transform .15s}
.sess[open] .chev{transform:rotate(90deg)}
.sess-body{padding:0 14px 14px;display:grid;gap:10px}
.lines{display:grid;gap:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.line .n{font-weight:600;font-size:14.5px}
.line .s{font-size:14px;color:var(--muted);grid-column:1}
.delta{font-size:12.5px;font-weight:600;align-self:start;white-space:nowrap}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.same{color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.panel h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:300px;height:auto}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}

.mob{gap:12px}
.mob-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.mob-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.mob-list{display:grid}
.mobrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mobrow input{width:22px;height:22px;margin:0;accent-color:var(--good);cursor:pointer}
.mobrow label{display:grid;gap:1px;cursor:pointer;min-width:0}
.mobrow .mn{font-weight:600;font-size:15.5px}
.mobrow .md{font-size:13.5px;color:var(--muted)}
.mobrow input:checked + label .mn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--good)}
.mobplan{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:grid;gap:6px}
.empty b{font-family:var(--f-display);font-size:20px}

/* exercise images */
.namerow{display:flex;align-items:flex-start;gap:8px}
.imgbtn{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink);cursor:pointer;vertical-align:middle}
.imgbtn:hover{border-color:var(--muted)}
.imgbtn svg{width:16px;height:16px}
td .imgbtn,li .imgbtn,.altn .imgbtn{width:26px;height:26px;margin-left:4px}
td .imgbtn svg,li .imgbtn svg,.altn .imgbtn svg{width:14px;height:14px}
.altn{display:inline-flex;align-items:center;gap:2px;margin-right:6px}
dialog.imgdlg{border:0;border-radius:14px;padding:0;width:calc(100vw - 32px);max-width:880px;max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);overflow:auto}
dialog.imgdlg::backdrop{background:rgba(10,14,20,.66)}
.dlg-in{padding:16px;display:grid;gap:12px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
.dlg-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-imgs.one{grid-template-columns:1fr;max-width:520px}
@media (max-width:560px){.dlg-imgs{grid-template-columns:1fr}}
.dlg-imgs figure{margin:0;display:grid;gap:6px}
.dlg-imgs img{display:block;width:100%;height:auto;border-radius:8px;background:var(--field)}
.dlg-imgs figcaption{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}

/* lock screen */
.gate{display:grid;place-items:center;padding-block:56px}
.gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.gate-card h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.plates{display:flex;gap:6px}
.plates span{width:14px;height:14px;border-radius:50%}
.gform{display:grid;gap:8px}
.gform input[type="password"]{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:48px;font-size:17px}
.gform .btn.primary{margin-top:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px}
.err{color:var(--crit);font-size:14px;min-height:1em}
.lockbtn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.lockbtn svg{width:18px;height:18px}

/* plan */
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.wk{height:34px;border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.wk.build{background:color-mix(in srgb,var(--pull) 18%,var(--surface));border-color:transparent;color:var(--ink)}
.wk.light{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.wk.now{outline:2px solid var(--ink);outline-offset:1px}
.phases{display:grid;gap:6px;font-size:14px}
.phases div{display:grid;grid-template-columns:96px 1fr;gap:10px}
.dayplan h3{margin:0;display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-size:21px}
ol.rules{margin:0;padding-left:20px;display:grid;gap:6px}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font-family:var(--f-display);font-weight:700;font-size:30px;min-width:76px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--bg);width:0}
.timer button{background:none;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:8px;padding:6px 10px;min-height:38px;font-weight:600;cursor:pointer}
.timer.over .t{color:var(--legs)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="gate" id="gate">
  <div class="gate-card"><h1>PPL Trainingsbuch</h1><p class="muted">Lädt …</p></div>
</div>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>PPL Trainingsbuch</h1>
      <div class="hdr-right">
        <div class="weekbadge num" id="weekbadge">Woche 1 / 12</div>
        <div class="elapsed num" id="elapsed" hidden><span class="el-l" id="elapsed-l">Dauer</span><span class="el-v" id="elapsed-v">0:00</span></div>
        <button type="button" class="lockbtn" data-act="lock" aria-label="Trainingsbuch sperren" title="Sperren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-training" aria-selected="true" data-tab="training">Training</button>
      <button role="tab" id="tab-verlauf" aria-selected="false" data-tab="verlauf">Verlauf</button>
      <button role="tab" id="tab-plan" aria-selected="false" data-tab="plan">Plan</button>
    </nav>
  </header>
  <main>
    <section class="view" id="view-training" role="tabpanel"></section>
    <section class="view" id="view-verlauf" role="tabpanel" hidden></section>
    <section class="view" id="view-plan" role="tabpanel" hidden></section>
  </main>
</div>
<dialog class="imgdlg" id="imgdlg" aria-labelledby="dlg-title"></dialog>
<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <span class="label" id="timer-l" style="color:inherit;opacity:.75">Pause</span>
    <span class="t num" id="timer-t">0:00</span>
    <span class="bar"><i id="timer-bar"></i></span>
    <button type="button" id="timer-plus">+30 s</button>
    <button type="button" id="timer-stop">Fertig</button>
  </div>
</div>

<script>
"use strict";
/* ---------- Plan data ---------- */
const DAYS = ["push","pull","legs"];

/* ---------- password lock ---------- */
const PW_ITER = 200000, LOCK_LS = "ppl-lock-v1", REMEMBER_LS = "ppl-remember-v1", SESSION_SS = "ppl-unlocked-v1";
const b64e = u8 => btoa(String.fromCharCode(...u8));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPw(pw, salt, iter, alg){
  if (alg !== "fnv" && window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64d(salt), iterations:iter, hash:"SHA-256"}, key, 256);
    return {alg:"pbkdf2", hash:b64e(new Uint8Array(bits))};
  }
  let h = salt + "|" + pw, out = "";
  for (let r = 0; r < 4; r++) { let x = 0x811c9dc5 ^ r; for (let k = 0; k < 4000; k++) for (let i = 0; i < h.length; i++) { x ^= h.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } out += x.toString(16).padStart(8, "0"); h = out + h; }
  return {alg:"fnv", hash:out};
}
async function makeLock(pw){
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const r = await hashPw(pw, salt, PW_ITER);
  return {kind:"lock", alg:r.alg, salt, hash:r.hash, iter:PW_ITER, updatedAt:Date.now()};
}
async function checkPw(pw){ if (!S.lock) return false; const r = await hashPw(pw, S.lock.salt, S.lock.iter || PW_ITER, S.lock.alg); return r.hash === S.lock.hash; }
async function saveLock(lock){
  if (S.mode === "cloud") await col.doc("lock").set(lock);
  else localStorage.setItem(LOCK_LS, JSON.stringify(lock));
  S.lock = lock;
}
function lsLockRead(){ try { return JSON.parse(localStorage.getItem(LOCK_LS) || "null"); } catch(e){ return null; } }
function remembered(){
  if (!S.lock) return false;
  try { if (sessionStorage.getItem(SESSION_SS) === S.lock.salt) return true; } catch(e) {}
  try { const r = JSON.parse(localStorage.getItem(REMEMBER_LS) || "null"); if (r && r.salt === S.lock.salt && r.until > Date.now()) return true; } catch(e) {}
  return false;
}
function markUnlocked(remember){
  try { sessionStorage.setItem(SESSION_SS, S.lock.salt); } catch(e) {}
  if (remember) { try { localStorage.setItem(REMEMBER_LS, JSON.stringify({salt:S.lock.salt, until:Date.now() + 30*864e5})); } catch(e) {} }
}
function forgetUnlock(){
  try { sessionStorage.removeItem(SESSION_SS); } catch(e) {}
  try { localStorage.removeItem(REMEMBER_LS); } catch(e) {}
}
function setGate(st){ S.gate = st; renderGate(); if (st === "unlocked") renderAll(); }
function evalGate(fromServer){
  if (S.gate === "loading") {

}

  const first = g.querySelector("input"); if (first) setTimeout(() => first.focus(), 0);
}
function weekOf(date){ return Math.floor((dayNum(date) - dayNum(S.settings.startDate)) / 7) + 1; }
function phaseOf(w){ return PHASES.find(p => w >= p.a && w <= p.b) || (w < 1 ? PHASES[0] : {a:w,b:w,name:"Nach dem Block",rir:"frei",note:"Die 12 Wochen sind vorbei. Plane den nächsten Block.",kind:"light"}); }
function sortedSessions(){
  return Object.entries(S.sessions).map(([id, s]) => Object.assign({id}, s))
    .sort((a,b) => a.date === b.date ? (b.updatedAt||0) - (a.updatedAt||0) : (a.date < b.date ? 1 : -1));
}
function suggestedDay(){
  const last = sortedSessions().find(s => s.done);
  if (!last) return "push";
  return DAYS[(DAYS.indexOf(last.day) + 1) % 3];
}
function doneSets(entry){ return (entry && entry.sets || []).filter(s => s.reps != null && s.reps > 0); }
function lastFor(exId, excludeId, beforeDate, v){
  for (const s of sortedSessions()){
    if (s.id === excludeId || !s.done) continue;
    if (beforeDate && s.date > beforeDate) continue;
    const e = s.entries && s.entries[exId];
    if (v != null && e && vOf(e) !== v) continue;
    if (e && doneSets(e).length) return {session:s, entry:e};
  }
  return null;
}
function topSet(sets){
  let best = null;
  sets.forEach(s => { const kg = s.kg ?? 0; if (!best || kg > best.kg || (kg === best.kg && s.reps > best.reps)) best = {kg, reps:s.reps}; });
  return best;
}
function setsText(sets, bw){
  return sets.map(s => `${bw ? (s.kg ? "+" + fmtKg(s.kg) : "BW") : (s.kg == null ? "–" : fmtKg(s.kg))}×${s.reps}`).join(" · ");
}
function suggestion(ex, last, week){
  const ph = phaseOf(week);
  if (!last) return {kg:null, text: week <= 1 ? "Gewicht neu einpendeln" : "Noch kein Vorwert", cls:""};
  const sets = doneSets(last.entry);
  const top = topSet(sets);
  if (ph.deload) return {kg: top.kg, text:"Deload: etwas leichter als letztes Mal, weniger Sätze", cls:"deload"};
  const hit = sets.length >= ex.sets && sets.every(s => s.reps >= ex.hi);
  if (hit) {
    return {kg: top.kg, text:"Ziel erreicht: Gewicht erhöhen", cls:"up"};
  }
  return {kg: top.kg, text:"Gleiches Gewicht, mehr Wiederholungen", cls:""};
}
function plannedKg(sug, last, i){
  const ls = last ? doneSets(last.entry) : [];
  if (!ls.length) return null;
  return (ls[i] || ls[ls.length-1]).kg;
}
function targetSets(ex, week){ return phaseOf(week).deload ? Math.ceil(ex.sets/2) : ex.sets; }

function newDraft(day, date){
  date = date || todayStr();
  const week = weekOf(date);
  const entries = {};
  PLAN[day].ex.forEach(ex => {
    const any = lastFor(ex.id, null, date);
    const v = any ? vOf(any.entry) : 0;
    const last = lastFor(ex.id, null, date, v);
    const sug = suggestion(ex, last, week);
    const n = targetSets(ex, week);
    entries[ex.id] = {v, sets: Array.from({length:n}, (_, i) => ({kg: plannedKg(sug, last, i), reps: null}))};
  });
  return {id: "s" + date.replace(/-/g,"") + "-" + uid6(), kind:"session", date, day, entries, note:"", mobility:{}, startTime:"", endTime:"", done:false, dirty:false, createdAt: Date.now()};
}

const pending = {}, inflight = {};
async function writeDoc(id, body){
  if (S.mode !== "cloud"){ if (body === null) delete S.sessions[id]; setStatus(lsWrite() ? "Gespeichert (nur in diesem Browser)" : "Speichern im Browser nicht möglich"); return; }
  pending[id] = {body};
  if (inflight[id]) return;
  inflight[id] = true;
  while (pending[id]) {
    const {body:b} = pending[id]; delete pending[id];
    setStatus("Speichert …");
    try {
      if (b === null) await col.doc(id).delete(); else await col.doc(id).set(b);
      const t = new Date(); setStatus(`Gespeichert ${pad(t.getHours())}:${pad(t.getMinutes())}`);
    } catch(e) {
      const code = e && e.code;
      if (code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*900)); if (!pending[id]) pending[id] = {body:b}; continue; }
      if (code === "quota_exceeded") setStatus("Speicher voll: lösche alte Einheiten im Verlauf.");

let saveTimer = null;

function setStatus(t){ S.status = t; const el = $("#savestatus"); if (el) el.textContent = t; }

async function init(){
  renderAll();
  let user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
      if (user) userId = await user.id();
    }
  } catch(e) { db = null; }
  if (db && userId) {
    S.mode = "cloud";
    col = db.collection("data/users/" + userId);
    setStatus("Lädt deine Einheiten …");
    const timer = setTimeout(() => {
      if (!S.loadedOnce) { if (!S.draft) afterData(); setStatus("Deine Daten sind gerade nicht erreichbar. Eingaben werden gespeichert, sobald die Verbindung steht."); }
      if (S.gate === "loading") { S.gateMsg = "Dein Trainingsbuch ist gerade nicht erreichbar. Es wird weiter versucht …"; renderGate(); }
    }, 10000);
    col.onSnapshot(snap => {
      const sessions = {}; let lockDoc = null;
      snap.docs.forEach(d => {
        const v = d.data(); if (!v) return;
        if (d.id === "settings") { S.settings = Object.assign({}, S.settings, {startDate: v.startDate || S.settings.startDate, perWeek: v.perWeek || S.settings.perWeek}); }
        else if (d.id === "lock") lockDoc = v;
        else if (v.kind === "session") sessions[d.id] = v;
      });
      const fromServer = !snap.metadata.fromCache;
      if (lockDoc || fromServer) S.lock = lockDoc;
      if (S.draft && S.draft.dirty && !sessions[S.draft.id]) sessions[S.draft.id] = draftBody();
      S.sessions = sessions;
      if (fromServer) { clearTimeout(timer); if (!S.loadedOnce) setStatus(""); S.loadedOnce = true; }
      afterData();
      evalGate(fromServer);
    }, err => {
      clearTimeout(timer); setStatus("Verbindung zu deinen Daten unterbrochen. Lade die Seite neu, um sie wieder abzurufen.");
      if (S.gate === "loading") { S.gateMsg = "Dein Trainingsbuch konnte nicht geladen werden. Lade die Seite neu."; renderGate(); }
    });
  } else {
    S.mode = "local";
    const saved = lsRead();
    if (saved) { S.settings = Object.assign(S.settings, saved.settings || {}); S.sessions = saved.sessions || {}; }
    S.lock = lsLockRead();
    S.loadedOnce = true;
    afterData();
    evalGate(true);
  }
}
function afterData(){

    if (open) S.draft = Object.assign({}, JSON.parse(JSON.stringify(open)), {id:open.id, dirty:false, resumed:true});
    else if (!S.draft || !S.draft.dirty) S.draft = newDraft(S.draft && S.draft.userPicked ? S.draft.day : suggestedDay(), S.draft ? S.draft.date : todayStr());

  else renderAll();
}

function updateElapsed(){
  const el = $("#elapsed"), d = S.draft;

  let label = "", val = "", stat = false;
  if (d && d.startTime && d.editingExisting) {
    if (d.endTime) { label = "Dauer"; val = fmtDur(minsBetween(d.startTime, d.endTime)); stat = true; }
  } else if (d && d.startTime) {
    const [y,m,dd] = d.date.split("-").map(Number), [h,mi] = d.startTime.split(":").map(Number);
    const ms = Date.now() - new Date(y, m-1, dd, h, mi).getTime();
    if (ms < 0) { label = "Start"; val = d.startTime; stat = true; }
    else if (ms > 6*3600e3) { label = "Start"; val = d.startTime; stat = true; }
    else { const sec = Math.floor(ms/1000), hh = Math.floor(sec/3600); label = "Dauer"; val = (hh ? hh + ":" + pad(Math.floor(sec/60)%60) : Math.floor(sec/60)) + ":" + pad(sec%60); }

function sessionStats(s){
  let sets = 0, reps = 0, volume = 0;
  Object.values(s.entries || {}).forEach(e => doneSets(e).forEach(x => { sets++; reps += x.reps; volume += (x.kg||0) * x.reps; }));
  return {sets, reps, volume};

function deltaFor(exId, s){
  const prev = lastFor(exId, s.id, s.date, vOf(s.entries[exId]));
  const cur = doneSets(s.entries[exId]);
  if (!prev || !cur.length) return {t:"neu", c:"same"};
  const a = topSet(cur), b = topSet(doneSets(prev.entry));
  const dk = Math.round(((a.kg||0) - (b.kg||0))*100)/100;
  if (dk > 0) return {t:`+${fmtKg(dk)} kg`, c:"up"};
  if (dk < 0) return {t:`${fmtKg(dk).replace("-","−")} kg`, c:"down"};
  const ra = cur.reduce((x,y)=>x+y.reps,0), rb = doneSets(prev.entry).reduce((x,y)=>x+y.reps,0);
  if (ra > rb) return {t:`+${ra-rb} Wdh.`, c:"up"};
  if (ra < rb) return {t:`−${rb-ra} Wdh.`, c:"down"};
  return {t:"gleich", c:"same"};
}

function progressPanel(){

  Object.values(S.sessions).forEach(s => s.done && Object.entries(s.entries || {}).forEach(([id, e]) => { if (doneSets(e).length) used.add(id + ":" + vOf(e)); }));
  const opts = DAYS.map(d => `<optgroup label="${PLAN[d].name}">${PLAN[d].ex.map(ex => [0,1,2,3].filter(k => k === 0 || used.has(ex.id + ":" + k)).map(k => { const val = ex.id + ":" + k; return `<option value="${val}" ${S.progressEx===val?"selected":""}>${esc(exName(ex, k))}</option>`; }).join("")).join("")}</optgroup>`).join("");
  return `<div class="panel"><div class="finish-row" style="justify-content:space-between"><h2>Übungsverlauf</h2>
    <select id="f-progress" aria-label="Übung auswählen">${opts}</select></div>
    <div id="chart"></div></div>`;
}
function drawChart(){
  const box = $("#chart"); if (!box) return;
  const [pid, pv] = S.progressEx.split(":"); const ex = EX[pid], vv = +pv || 0, exN = exName(ex, vv);
  const pts = sortedSessions().filter(s => s.done && s.entries && doneSets(s.entries[ex.id]).length && vOf(s.entries[ex.id]) === vv).reverse()
    .map(s => { const sets = doneSets(s.entries[ex.id]); const t = topSet(sets); return {s, sets, top:t, reps:sets.reduce((a,b)=>a+b.reps,0)}; });
  if (!pts.length) { box.innerHTML = `<div class="muted small">Für ${esc(exN)} gibt es noch keine Einträge. Nach der ersten ${esc(PLAN[ex.day].name)}-Einheit siehst du hier dein Top-Gewicht pro Einheit.</div>`; return; }
  const W = 640, H = 220, L = 48, R = 16, T = 18, B = 34;
  const vals = pts.map(p => p.top.kg || 0);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const span = hi - lo, step = niceStep(span / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = i => pts.length === 1 ? L + (W-L-R)/2 : L + i * (W-L-R) / (pts.length-1);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H-T-B);
  let ticks = ""; for (let v = lo; v <= hi + 1e-9; v += step) ticks += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmtKg(v)}</text>`;
  const path = pts.map((p,i) => `${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.top.kg||0).toFixed(1)}`).join(" ");
  const area = `${path} L${X(pts.length-1).toFixed(1)} ${H-B} L${X(0).toFixed(1)} ${H-B} Z`;
  const every = Math.max(1, Math.ceil(pts.length / 6));
  const xl = pts.map((p,i) => (i % every === 0 || i === pts.length-1) ? `<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(fmtDate(p.s.date).slice(3))}</text>` : "").join("");
  const dots = pts.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.top.kg||0)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"var(--ink)":"var(--surface)"}" stroke="var(--ink)" stroke-width="2"><title>${esc(fmtDate(p.s.date))}: ${esc(fmtKg(p.top.kg))} kg × ${p.top.reps}</title></circle>`).join("");
  const lp = pts[pts.length-1];
  const endLbl = `<text x="${Math.min(X(pts.length-1), W-R-4)}" y="${Math.max(Y(lp.top.kg||0)-12, 12)}" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">${esc(fmtKg(lp.top.kg))} kg × ${lp.top.reps}</text>`;
  const rows = pts.slice().reverse().slice(0, 12).map(p => `<tr><td>${esc(fmtDate(p.s.date))}</td><td class="num">${esc(setsText(p.sets, ex.bw))}</td><td class="num">${p.reps}</td></tr>`).join("");
  box.innerHTML = `<div class="small muted">Schwerster Satz pro Einheit in kg${ex.bw ? " (Zusatzgewicht)" : ""}</div>
    <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top-Gewicht pro Einheit für ${esc(exN)}">
      ${ticks}<path d="${area}" fill="var(--ink)" fill-opacity="0.07"/><path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>${dots}${endLbl}${xl}
    </svg></div>
    <div class="tbl"><table><thead><tr><th>Datum</th><th class="num">Sätze (kg × Wdh.)</th><th class="num">Wdh. gesamt</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function niceStep(raw){ if (raw <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b === tab)); ["training","verlauf","plan"].forEach(k => $("#view-"+k).hidden = k !== S.tab); renderAll(); window.scrollTo({top:0}); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, d = S.draft;
  if (act === "day") {
    const day = b.dataset.day; if (day === d.day) return;
    const hasReps = Object.values(d.entries).some(x => doneSets(x).length);
    if (hasReps && !d.editingExisting) { $("#daynote").innerHTML = `<div class="notice">In dieser ${esc(PLAN[d.day].name)}-Einheit sind schon Sätze eingetragen. Schließe sie ab oder verwirf sie, bevor du die Einheit wechselst.</div>`; return; }
    if (d.editingExisting) { $("#daynote").innerHTML = `<div class="notice">Beim Bearbeiten bleibt die Einheit gleich. Lege für eine andere Einheit eine neue an.</div>`; return; }
    const wasStored = d.dirty || d.resumed;
    const nd = newDraft(day, d.date); nd.userPicked = true;
    if (wasStored) { nd.id = d.id; nd.dirty = true; S.draft = nd; persistDraft(); } else S.draft = nd;
    renderTraining(); return;
  }
  if (act === "swap") { S.swapOpen = S.swapOpen === b.dataset.ex ? null : b.dataset.ex; renderTraining(); return; }
  if (act === "pick") {
    const ex = EX[b.dataset.ex], en = d.entries[ex.id], nv = +b.dataset.v;
    S.swapOpen = null;
    if (vOf(en) !== nv) {
      en.v = nv; delete en.alt;
      const lst = lastFor(ex.id, d.id, d.date, nv), sug = suggestion(ex, lst, weekOf(d.date));
      en.sets.forEach((s, i) => { if (!(s.reps > 0)) s.kg = plannedKg(sug, lst, i); });
      scheduleDraftSave();
    }
    renderTraining(); return;
  }
  if (act === "now") { d.startTime = nowHM(); const ft = $("#f-time"); if (ft) ft.value = d.startTime; scheduleDraftSave(); updateElapsed(); return; }
  if (act === "addset") { const s = d.entries[b.dataset.ex].sets; const prev = s[s.length-1]; s.push({kg: prev ? prev.kg : null, reps:null}); scheduleDraftSave(); renderTraining(); focusLater(`#reps-${b.dataset.ex}-${s.length-1}`); return; }
  if (act === "delset") { d.entries[b.dataset.ex].sets.pop(); scheduleDraftSave(); renderTraining(); return; }
  if (act === "copylast") { const last = lastFor(b.dataset.ex, d.id, d.date, vOf(d.entries[b.dataset.ex])); if (!last) return; const ls = doneSets(last.entry); d.entries[b.dataset.ex].sets.forEach((s, i) => { s.kg = (ls[i] || ls[ls.length-1]).kg; }); scheduleDraftSave(); renderTraining(); return; }
  if (act === "rest") { startTimer(+b.dataset.s, b.dataset.l || "Pause"); return; }
  if (act === "finish") { finishSession(); return; }
  if (act === "discard") { S.confirmDiscard = true; renderTraining(); return; }
  if (act === "discard-no") { S.confirmDiscard = false; renderTraining(); return; }
  if (act === "discard-yes") { discardDraft(); return; }
  if (act === "dismiss-done") { S.justFinished = null; renderTraining(); return; }
  if (act === "edit") { const s = S.sessions[b.dataset.sid]; if (!s) return; S.draft = Object.assign(JSON.parse(JSON.stringify(s)), {id:b.dataset.sid, dirty:false, editingExisting: !!s.done, resumed: !s.done}); S.justFinished = null; S.confirmDiscard = false; $("#tab-training").click(); return; }
  if (act === "del") { S.confirmDelete = b.dataset.sid; S.openSession = b.dataset.sid; renderVerlauf(); return; }
  if (act === "del-no") { S.confirmDelete = null; renderVerlauf(); return; }
  if (act === "del-yes") { const id = b.dataset.sid; delete S.sessions[id]; S.confirmDelete = null; writeDoc(id, null); if (S.draft && S.draft.id === id) S.draft = newDraft(suggestedDay(), todayStr()); renderVerlauf(); return; }
  if (act === "export") { exportCsv(); return; }
  if (act === "img") { openImg(b.dataset.k, b.dataset.n); return; }
  if (act === "img-close") { closeImg(); return; }
  if (act === "lock") { if (S.draft && S.draft.dirty) persistDraft(); forgetUnlock(); S.pwOpen = false; setGate(S.lock ? "enter" : "setup"); window.scrollTo({top:0}); return; }
  if (act === "pw-toggle") { S.pwOpen = !S.pwOpen; renderPlan(); if (S.pwOpen) focusLater("#pw-cur"); return; }
  if (act === "forgot") {
    $("#g-forgot").innerHTML = S.mode === "cloud"
      ? `Sag Claude im Chat, dass die Sperre deines PPL Trainingsbuchs zurückgesetzt werden soll. Deine Trainingsdaten bleiben dabei erhalten, danach legst du hier ein neues Passwort fest.`
      : `Hier sind die Einträge nur in diesem Browser gespeichert. Das Passwort lässt sich nur zusammen mit ihnen löschen. <div class="confirm" style="margin-top:8px"><button type="button" class="btn danger" data-act="local-reset">Sperre und Einträge löschen</button></div>`;
    return;
  }
  if (act === "local-reset") {
    try { localStorage.removeItem(LOCK_LS); localStorage.removeItem(LS_KEY); } catch(e) {}
    forgetUnlock(); S.lock = null; S.sessions = {}; S.draft = newDraft("push", todayStr()); setGate("setup"); return;
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type="submit"]'), err = f.querySelector(".err");
  const say = t => { if (err) err.textContent = t; };
  if (f.id === "gate-setup" || f.id === "pw-change") {
    const isChange = f.id === "pw-change";
    const n1 = f.querySelector(isChange ? "#pw-new" : "#g-new").value, n2 = f.querySelector(isChange ? "#pw-new2" : "#g-new2").value;
    if (n1.length < 4) { say("Das Passwort braucht mindestens 4 Zeichen."); return; }
    if (n1 !== n2) { say("Die beiden Passwörter stimmen nicht überein."); return; }
    btn.disabled = true; say("");
    try {
      if (isChange && !(await checkPw(f.querySelector("#pw-cur").value))) { say("Das aktuelle Passwort stimmt nicht."); btn.disabled = false; return; }
      let keep = false; try { keep = !!localStorage.getItem(REMEMBER_LS); } catch(x) {}
      await saveLock(await makeLock(n1));
      forgetUnlock(); markUnlocked(isChange && keep);
      if (isChange) { S.pwOpen = false; renderPlan(); const st = $("#pw-status"); if (st) st.textContent = "Passwort geändert."; }
      else setGate("unlocked");
    } catch(x) { say("Das Passwort konnte nicht gespeichert werden. Prüfe die Verbindung und versuch es noch einmal."); btn.disabled = false; }
    return;
  }
  if (f.id === "gate-enter") {
    const pw = f.querySelector("#g-pw");
    if (!pw.value) { say("Gib dein Passwort ein."); return; }
    btn.disabled = true; say("");
    const ok = await checkPw(pw.value);
    if (ok) { markUnlocked(f.querySelector("#g-remember").checked); setGate("unlocked"); }
    else { say("Falsches Passwort. Versuch es noch einmal."); pw.value = ""; pw.focus(); btn.disabled = false; }
  }
});

async function finishSession(){
  const d = S.draft;
  Object.values(d.entries).forEach(e => { e.sets = doneSets(e); });
  if (!d.editingExisting && d.startTime && d.date === todayStr()) d.endTime = nowHM();
  d.done = true;
  const body = draftBody(); S.sessions[d.id] = body;
  const st = sessionStats(body);
  const wasEdit = d.editingExisting;
  S.draft = null;
  await writeDoc(d.id, body);
  if (wasEdit) { S.justFinished = null; S.openSession = d.id; S.draft = newDraft(suggestedDay(), todayStr()); $("#tab-verlauf").click(); return; }
  S.justFinished = Object.assign({day:d.day, dur: body.startTime && body.endTime ? minsBetween(body.startTime, body.endTime) : null}, st);
  S.draft = newDraft(suggestedDay(), todayStr());
  S.confirmDiscard = false;
  renderTraining(); window.scrollTo({top:0, behavior:"smooth"});
}
function discardDraft(){
  const d = S.draft; S.confirmDiscard = false;
  clearTimeout(saveTimer);
  if (d.editingExisting) { S.draft = newDraft(suggestedDay(), todayStr()); $("#tab-verlauf").click(); return; }
  if (S.sessions[d.id] || d.dirty || d.resumed) { delete S.sessions[d.id]; writeDoc(d.id, null); }
  S.draft = newDraft(suggestedDay(), todayStr());
  renderTraining();
}

/* ---------- rest timer ---------- */
const TM = {end:0, total:0, iv:null, beeped:false, ctx:null};
function startTimer(sec, label){
  $("#timer-l").textContent = label || "Pause";
  try { TM.ctx = TM.ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  TM.total = sec; TM.end = Date.now() + sec*1000; TM.beeped = false;
  $("#timer").hidden = false; clearInterval(TM.iv); TM.iv = setInterval(tick, 250); tick();
}
function tick(){
  const left = Math.round((TM.end - Date.now())/1000);
  const a = Math.abs(left);
  $("#timer-t").textContent = (left < 0 ? "+" : "") + Math.floor(a/60) + ":" + pad(a%60);
  $("#timer-bar").style.width = Math.min(100, Math.max(0, (1 - left/TM.total)*100)) + "%";
  $("#timer").classList.toggle("over", left < 0);
  if (left <= 0 && !TM.beeped) { TM.beeped = true; beep(); }
}
function beep(){
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e) {}
  try { const c = TM.ctx; if (!c) return; [0, .25].forEach(off => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, c.currentTime+off); g.gain.exponentialRampToValueAtTime(.25, c.currentTime+off+.02); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+off+.2); o.connect(g).connect(c.destination); o.start(c.currentTime+off); o.stop(c.currentTime+off+.22); }); } catch(e) {}
}
$("#timer-plus").addEventListener("click", () => { TM.end += 30000; TM.total += 30; TM.beeped = false; tick(); });
$("#timer-stop").addEventListener("click", () => { clearInterval(TM.iv); $("#timer").hidden = true; });

let wake = null;
async function requestWake(){ if (wake || !navigator.wakeLock) return; try { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } catch(e) { wake = "denied"; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wake === null && S.draft && S.draft.dirty) requestWake(); });

/* ---------- export ---------- */
async function exportCsv(){
  const st = $("#exportstatus");
  const rows = [["Datum","Woche","Einheit","Übung","Satz","kg","Wiederholungen"]];
  sortedSessions().filter(s => s.done).reverse().forEach(s => PLAN[s.day].ex.forEach(ex => { const e = s.entries && s.entries[ex.id]; doneSets(e).forEach((x, i) => rows.push([s.date, weekOf(s.date), PLAN[s.day].name, exName(ex, vOf(e)), i+1, x.kg == null ? "" : String(x.kg).replace(".", ","), x.reps])); }));
  if (rows.length === 1) { st.textContent = "Noch nichts zu exportieren."; return; }
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  try { const r = await downloads.save({filename:`ppl-trainingsbuch-${todayStr()}.csv`, data:"﻿" + csv}); st.textContent = r.status === "saved" ? "Exportiert." : ""; }
  catch(e) { st.textContent = e && e.code === "declined" ? "" : "Export ist hier gerade nicht möglich."; }
}

init();
</script>
